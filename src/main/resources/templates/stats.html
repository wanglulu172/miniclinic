<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; padding: 20px; background: #F1F5F9; border-radius: 8px; text-align: center; border-top: 4px solid #14B8A6; }
        .card h3 { margin: 0; color: #64748B; font-size: 0.9rem; }
        .card p { margin: 10px 0 0; font-size: 2rem; font-weight: bold; color: #0F2443; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
    </style>
</head>
<body>
    <h1>營運統計數據</h1>
    <div class="stats-container">
        <div class="card">
            <h3>醫師總數</h3>
            <p th:text="${doctorCount}">0</p>
        </div>
        <div class="card">
            <h3>病患總數</h3>
            <p th:text="${patientCount}">0</p>
        </div>
        <div class="card">
            <h3>掛號總數</h3>
            <p th:text="${appointmentCount}">0</p>
        </div>
    </div>
    <h2>科別掛號分布</h2>
    <table>
        <thead>
            <tr>
                <th>科別名稱</th>
                <th>累積掛號人次</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="stat : ${deptStats}">
                <td th:text="${stat[0]}">科別</td>
                <td th:text="${stat[1]}">0人</td>
            </tr>
        </tbody>
    </table>
    <p style="margin-top: 30px;">
        <a th:href="@{/}">← 返回首頁</a>
    </p>
</body>
</html>
